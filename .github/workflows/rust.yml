name: Rust checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev xvfb xauth xdotool
      - name: Check and test
        run: cargo test
      - name: Desktop startup smoke test
        run: |
          cargo build
          bash tools/smoke_desktop.sh
